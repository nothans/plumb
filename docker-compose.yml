# docker compose up  ->  http://localhost:8080, seeded with the DOGFOOD fixtures (demo mode).
# The test logins are printed in the log on every boot.
services:
  plumb:
    build: .
    image: plumb:local
    ports:
      - "8080:8080"
    environment:
      # Demo mode seeds fixtures.json and turns on the published demo logins
      # (their cookies are in .dogfood.toml). Never run a real event with it:
      # see "Run a real event" in README.md.
      PLUMB_DEMO: "1"
      # The public address: written into invitation links and signed into every record.
      PLUMB_BASE_URL: "http://localhost:8080"
      # Lets tools/acceptance_extended.py receive webhooks on the host (demo only).
      PLUMB_WEBHOOKS_ALLOW_HOSTS: "host.docker.internal"
      # PLUMB_ADMIN_EMAIL / PLUMB_ADMIN_PASSWORD create the first admin on a non-demo install.
      # PLUMB_SECURE_COOKIES: "1"          # behind HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - plumb-data:/data
    restart: unless-stopped

volumes:
  plumb-data:
